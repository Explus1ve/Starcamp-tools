[project]
name = "voicetype"
version = "0.1.0"
description = "Push-to-talk dictation into the focused window, tuned for the Claude Code CLI."
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "pynput>=1.7.7",
    "pyperclip>=1.9.0",
    "nvidia-cublas-cu12>=12.4; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
]
